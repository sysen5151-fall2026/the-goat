name: Chapter 3 specification acceptance baseline

on:
  push:
  pull_request:

jobs:
  acceptance-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run intentionally red Chapter 3 acceptance tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
